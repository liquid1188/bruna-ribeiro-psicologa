backend:
  name: github
  repo: liquid1188/bruna-ribeiro-psicologa
  branch: main
media_folder: src/images/reflexoes
public_folder: /images/reflexoes
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 1600
        height: 1600
locale: pt
site_url: https://www.psicologabrunaribeiro.com
collections:
  - name: reflexoes
    label: Reflexões
    label_singular: Reflexão
    description: "Seus textos da página Reflexões. Cada um vira uma página própria no site. Para mudar outras partes do site, fale com o Andrew. Errou algo? Abra /admin/history/ para voltar a uma versão anterior."
    folder: src/reflexoes
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    sortable_fields: [ordem, title]
    summary: "{{ordem}}. {{title}}"
    fields:
      - { name: title, label: Título }
      - { name: categoria, label: "Categoria (ex.: Sobre começar)" }
      - { name: ordem, label: "Ordem na lista (1 aparece primeiro)", widget: number, value_type: int, default: 10 }
      - { name: destaqueInicio, label: Mostrar na página inicial, widget: boolean, default: false }
      - { name: resumo, label: "Resumo (aparece na lista e abaixo do título)", widget: text }
      - { name: imagem, label: "Foto (opcional)", widget: image, required: false }
      - { name: imagemAlt, label: "Descrição da foto, para leitores de tela (opcional)", required: false }
      - { name: frase, label: "Frase em destaque (cada linha vira uma faixa)", widget: text, required: false }
      - { name: body, label: Texto, widget: markdown, required: false }
